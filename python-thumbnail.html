<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Python Introduction Thumbnail</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #6a0572 0%, #3a0077 50%, #0b0b83 100%);
      color: white;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      position: relative;
      overflow: hidden;
    }

    .container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 1200px;
      width: 100%;
      background-color: rgba(0, 0, 0, 0.2);
      border-radius: 20px;
      padding: 40px;
      position: relative;
      z-index: 2;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .left {
      flex: 1;
      padding: 20px;
      z-index: 2;
    }

    .left h1 {
      font-size: 4.5em;
      margin-bottom: 20px;
      font-weight: 800;
      text-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
      background: linear-gradient(to right, #fff, #f0f0f0);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1.1;
    }

    .left h2 {
      font-size: 2.5em;
      margin-bottom: 30px;
      font-weight: 600;
      color: #ffd700;
    }

    .by-line {
      display: flex;
      align-items: center;
      font-size: 1.5em;
      margin-top: 40px;
    }

    .by-line img {
      height: 40px;
      margin-right: 15px;
      margin-left: 10px;
      filter: drop-shadow(0 2px 5px rgba(0, 0, 0, 0.3));
    }

    .right {
      display: flex;
      flex-direction: row;
      margin-top: 10px;
      justify-content: center;
            background: linear-gradient(135deg, #ffffff, #f0f0f0);

      align-items: center;
      height: 300px;
            border-radius: 50%;

    width: 300px;    }
    .right img{
      margin-top: 20px;
    }

    .right img {
      width: 280px;

      padding-top: 35px;
      padding: 50px;
    }

    .footer {
      position: absolute;
      bottom: 30px;
      font-size: 1.2em;
      text-align: center;
      width: 100%;
      z-index: 2;
    }

    .footer img {
      height: 30px;
      margin-right: 10px;
      vertical-align: middle;
      filter: drop-shadow(0 2px 3px rgba(0, 0, 0, 0.3));
    }

    .footer span {
      text-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
    }

    /* Decorative elements */
    .circle {
      position: absolute;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.05);
      z-index: 1;
    }

    .circle-1 {
      width: 300px;
      height: 300px;
      top: -100px;
      left: -100px;
    }

    .circle-2 {
      width: 200px;
      height: 200px;
      bottom: -50px;
      right: -50px;
    }

    .circle-3 {
      width: 150px;
      height: 150px;
      top: 50%;
      right: 20%;
    }

    .code-snippet {
      position: absolute;
      font-family: monospace;
      color: rgba(255, 255, 255, 0.1);
      font-size: 0.8em;
      transform: rotate(-10deg);
      z-index: 1;
    }

    .snippet-1 {
      top: 20%;
      left: 10%;
    }

    .snippet-2 {
      bottom: 25%;
      right: 15%;
    }

    /* Download button */
    .download-btn {
      position: absolute;
      top: 20px;
      right: 20px;
      background: linear-gradient(135deg, #ff8a00, #ff0058);
      color: white;
      border: none;
      padding: 12px 25px;
      border-radius: 50px;
      font-family: 'Poppins', sans-serif;
      font-weight: 600;
      font-size: 1em;
      cursor: pointer;
      box-shadow: 0 5px 15px rgba(255, 0, 88, 0.3);
      transition: all 0.3s ease;
      z-index: 10;
    }

    .download-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 20px rgba(255, 0, 88, 0.4);
    }

    .download-btn:active {
      transform: translateY(1px);
    }

    /* Print button */
    .print-btn {
      position: absolute;
      top: 20px;
      right: 180px;
      background: linear-gradient(135deg, #00c6ff, #0072ff);
      color: white;
      border: none;
      padding: 12px 25px;
      border-radius: 50px;
      font-family: 'Poppins', sans-serif;
      font-weight: 600;
      font-size: 1em;
      cursor: pointer;
      box-shadow: 0 5px 15px rgba(0, 114, 255, 0.3);
      transition: all 0.3s ease;
      z-index: 10;
    }

    .print-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 20px rgba(0, 114, 255, 0.4);
    }

    .print-btn:active {
      transform: translateY(1px);
    }

    /* Animation */
    @keyframes float {
      0% {
        transform: translateY(0px);
      }
      50% {
        transform: translateY(-20px);
      }
      100% {
        transform: translateY(0px);
      }
    }

    /* Glow effects */
    .glow {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      z-index: 0;
      overflow: hidden;
    }

    .glow-circle {
      position: absolute;
      border-radius: 50%;
      filter: blur(60px);
      opacity: 0.6;
    }

    .glow-1 {
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, #ff00aa, transparent 70%);
      top: -100px;
      left: -100px;
    }

    .glow-2 {
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, #00aaff, transparent 70%);
      bottom: -100px;
      right: -100px;
    }

    /* Particles */
    .particles {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      overflow: hidden;
    }

    .particle {
      position: absolute;
      background: rgba(255, 255, 255, 0.5);
      border-radius: 50%;
      animation: float-particle linear infinite;
    }

    @keyframes float-particle {
      0% {
        transform: translateY(0) translateX(0);
        opacity: 0;
      }
      10% {
        opacity: 1;
      }
      90% {
        opacity: 1;
      }
      100% {
        transform: translateY(-100vh) translateX(20px);
        opacity: 0;
      }
    }

    /* Responsive */
    @media (max-width: 768px) {
      .container {
        flex-direction: column;
        text-align: center;
      }
      
      .left h1 {
        font-size: 3em;
      }
      
      .left h2 {
        font-size: 1.8em;
      }
      
      .right img {
        width: 200px;
        height: 200px;
        margin-top: 30px;
      }

      .download-btn, .print-btn {
        position: relative;
        top: auto;
        right: auto;
        margin: 10px auto;
        display: block;
        width: 80%;
      }

      .print-btn {
        margin-top: 20px;
      }
    }

    /* Print styles */
    @media print {
      body {
        background: linear-gradient(135deg, #6a0572 0%, #3a0077 50%, #0b0b83 100%) !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
        padding: 0 !important;
        margin: 0 !important;
      }

      .container {
        box-shadow: none !important;
        border: none !important;
        page-break-after: avoid !important;
        page-break-inside: avoid !important;
        break-inside: avoid !important;
        margin: 0 auto !important;
        max-width: 100% !important;
        height: 100vh !important;
        display: flex !important;
        padding: 20px !important;
        background-color: rgba(0, 0, 0, 0.2) !important;
      }

      .download-btn, .print-btn {
        display: none !important;
      }

      .left h1 {
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
        background: linear-gradient(to right, #fff, #f0f0f0) !important;
        -webkit-background-clip: text !important;
        -webkit-text-fill-color: transparent !important;
      }

      .right img {
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
        background: linear-gradient(135deg, #ffffff, #f0f0f0) !important;
      }

      .footer, .by-line {
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }

      @page {
        size: auto;
        margin: 0;
      }
    }

    /* Enhanced visual effects */
    .sparkle {
      position: absolute;
      width: 5px;
      height: 5px;
      background: white;
      border-radius: 50%;
      filter: blur(1px);
      animation: sparkle 2s infinite;
      opacity: 0;
    }

    @keyframes sparkle {
      0% {
        transform: scale(0.5);
        opacity: 0;
      }
      50% {
        transform: scale(1.2);
        opacity: 0.8;
      }
      100% {
        transform: scale(0.5);
        opacity: 0;
      }
    }

    /* 3D effect for container */
    .container {
      transform-style: preserve-3d;
      perspective: 1000px;
    }

    .container::before {
      content: '';
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      bottom: 10px;
      border-radius: 15px;
      background: linear-gradient(135deg, rgba(255,255,255,0.1), rgba(255,255,255,0));
      transform: translateZ(-20px);
      filter: blur(10px);
      z-index: -1;
      opacity: 0.5;
    }

    /* Neon border effect */
    .container::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      border-radius: 20px;
      padding: 2px;
      background: linear-gradient(135deg, #ff00aa, #00aaff);
      -webkit-mask: 
        linear-gradient(#fff 0 0) content-box, 
        linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
      z-index: 1;
      animation: borderGlow 4s linear infinite;
    }

    @keyframes borderGlow {
      0% {
        opacity: 0.7;
      }
      50% {
        opacity: 1;
      }
      100% {
        opacity: 0.7;
      }
    }
  </style>
</head>
<body>

  
  <!-- Visual effects elements -->
  <div class="glow">
    <div class="glow-circle glow-1"></div>
    <div class="glow-circle glow-2"></div>
  </div>
  
  <div class="circle circle-1"></div>
  <div class="circle circle-2"></div>
  <div class="circle circle-3"></div>
  
  <div class="code-snippet snippet-1">
    print("Hello GuideRay")<br>
    def learn_python():<br>
    &nbsp;&nbsp;return "Success!"
  </div>
  
  <div class="code-snippet snippet-2">
    # Telugu Python Course<br>
    for student in learners:<br>
    &nbsp;&nbsp;student.succeed()
  </div>

  <!-- Sparkle elements -->
  <div id="sparkles-container"></div>

  <div class="container">
    <div class="left">
      <h1>PYTHON PROGRAMMING</h1>
      <h2>Python Introduction</h2>
      <div class="by-line">
          <span>by</span>
 <br/>
        <img src="https://res.cloudinary.com/dx97khgxd/image/upload/v1747826507/b4r9unmciqqgfiuncwcp.png" alt="GuideRay Logo">
      </div>
    </div>
    <div class="right">
      <img src="https://upload.wikimedia.org/wikipedia/commons/c/c3/Python-logo-notext.svg" alt="Python Logo">
    </div>
  </div>
  <div class="footer">
    <span><strong>GuideRay</strong> Exclusive courses provider in Telugu language</span>
  </div>

  <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
  <script>
    // Create sparkles
    function createSparkles() {
      const container = document.getElementById('sparkles-container');
      const count = 30;
      
      for (let i = 0; i < count; i++) {
        const sparkle = document.createElement('div');
        sparkle.classList.add('sparkle');
        
        // Random position
        const left = Math.random() * 100;
        const top = Math.random() * 100;
        const delay = Math.random() * 5;
        const duration = 2 + Math.random() * 3;
        
        sparkle.style.left = `${left}%`;
        sparkle.style.top = `${top}%`;
        sparkle.style.animationDelay = `${delay}s`;
        sparkle.style.animationDuration = `${duration}s`;
        
        container.appendChild(sparkle);
      }
    }
    
    // Create particles
    function createParticles() {
      const container = document.createElement('div');
      container.classList.add('particles');
      document.body.appendChild(container);
      
      const particleCount = 30;
      
      for (let i = 0; i < particleCount; i++) {
        const particle = document.createElement('div');
        particle.classList.add('particle');
        
        // Random size
        const size = Math.random() * 5 + 1;
        particle.style.width = `${size}px`;
        particle.style.height = `${size}px`;
        
        // Random position
        const left = Math.random() * 100;
        particle.style.left = `${left}%`;
        particle.style.bottom = `-${size}px`;
        
        // Random animation
        const duration = 10 + Math.random() * 20;
        const delay = Math.random() * 15;
        particle.style.animationDuration = `${duration}s`;
        particle.style.animationDelay = `${delay}s`;
        
        container.appendChild(particle);
      }
    }
    
    // Download functionality
    document.getElementById('downloadBtn').addEventListener('click', function() {
      // Hide buttons temporarily
      const buttons = document.querySelectorAll('.download-btn, .print-btn');
      buttons.forEach(btn => btn.style.visibility = 'hidden');
      
      // Capture the container div with higher quality
      html2canvas(document.querySelector('.container'), {
        scale: 2,
        logging: false,
        useCORS: true,
        allowTaint: true,
        backgroundColor: 'transparent'
      }).then(canvas => {
        // Create download link
        const link = document.createElement('a');
        link.download = 'python-thumbnail-guideray.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
        
        // Show buttons again
        buttons.forEach(btn => btn.style.visibility = 'visible');
      });
    });
    

    
    // Initialize effects
    window.addEventListener('load', function() {
      createSparkles();
      createParticles();
      
      // Add hover effect to container
      const container = document.querySelector('.container');
      container.addEventListener('mousemove', function(e) {
        const xAxis = (window.innerWidth / 2 - e.pageX) / 25;
        const yAxis = (window.innerHeight / 2 - e.pageY) / 25;
        container.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
      });
      
      container.addEventListener('mouseenter', function() {
        container.style.transition = 'transform 0.1s ease';
      });
      
      container.addEventListener('mouseleave', function() {
        container.style.transition = 'transform 0.5s ease';
        container.style.transform = 'rotateY(0deg) rotateX(0deg)';
      });
    });
  </script>
</body>
</html>
